<script>
const bank=[
{q:"Según el resumen del capítulo, ¿qué caracteriza al remanente de los últimos días?",a:["Guarda los mandamientos de Dios y la fe de Jesús","Se separa de toda misión mundial","Está compuesto solo por dirigentes","Reemplaza el evangelio por tradiciones"],c:0,e:"Apocalipsis 12:17 y 14:12 describen al remanente por su fidelidad a Dios y la fe de Jesús."},
{q:"¿Qué anuncia el remanente según el resumen inicial?",a:["La hora del juicio, la salvación en Cristo y la proximidad de su segunda venida","La fecha exacta del regreso de Cristo","Una salvación obtenida por obras humanas","La abolición de los mandamientos"],c:0,e:"La misión comprende anunciar el juicio, la salvación por Cristo y su regreso cercano."},
{q:"¿Qué simboliza la mujer pura de Apocalipsis 12 en la profecía bíblica?",a:["La iglesia fiel de Dios","El Imperio Romano","La ciudad de Babilonia","Un gobernante político"],c:0,e:"El capítulo explica que una mujer pura representa a la iglesia fiel de Dios."},
{q:"¿A quién representa el dragón que busca devorar al niño?",a:["A Satanás, que empleó al Imperio Romano contra Jesús","Al apóstol Juan","Al pueblo remanente","Al emperador Justiniano"],c:0,e:"Apocalipsis identifica al dragón con el diablo y Satanás; el Imperio Romano fue su instrumento contra Jesús."},
{q:"¿Quién es el niño varón de Apocalipsis 12 en la interpretación del capítulo?",a:["Jesucristo, el Mesías","Juan el Bautista","El apóstol Pablo","El emperador romano"],c:0,e:"El niño es el Mesías esperado, Jesucristo."},
{q:"¿Qué logró Cristo en la cruz respecto de Satanás?",a:["Lo derrotó y limitó su capacidad de acusar al pueblo de Dios ante el cielo","Le concedió autoridad sobre la iglesia","Canceló la misión cristiana","Hizo innecesaria la vigilancia espiritual"],c:0,e:"El capítulo presenta la cruz como la derrota de Satanás y su expulsión como acusador celestial."},
{q:"¿Cuánto tiempo representa “un tiempo, tiempos y la mitad de un tiempo” en Apocalipsis 12?",a:["Tres años y medio, o 1.260 días proféticos","Siete años exactos","Cuatrocientos noventa días","Mil años literales"],c:0,e:"La expresión se equipara en el texto a tres años y medio o 1.260 días proféticos."},
{q:"¿Qué principio se usa para interpretar los 1.260 días proféticos?",a:["El principio de día por año","El principio de una semana por siglo","El principio de día por mes","El principio de repetición literal"],c:0,e:"El capítulo remite al principio profético de día por año."},
{q:"¿Qué representa el desierto en el relato de Apocalipsis 12?",a:["Un refugio para los fieles durante la persecución","El lugar de origen del dragón","La sede del Imperio Romano","El sitio del juicio celestial"],c:0,e:"Las zonas poco pobladas del mundo proveyeron refugio a los fieles durante la persecución."},
{q:"¿Qué ocurrió al concluir el período de los 1.260 años según el capítulo?",a:["El pueblo fiel emergió como remanente, aún perseguido por Satanás","La iglesia dejó de tener misión","La segunda venida ocurrió inmediatamente","Desaparecieron todos los creyentes"],c:0,e:"Al terminar el período, el remanente aparece; Satanás sigue haciendo guerra contra él."},
{q:"¿Qué advirtió Jesús acerca del tiempo previo a su regreso?",a:["Surgirían falsos cristos y falsos profetas capaces de engañar","No habría engaño religioso","La iglesia no sufriría tribulación","Todas las señales serían políticas"],c:0,e:"Mateo 24 advierte sobre falsos cristos y falsos profetas y un tiempo de tribulación."},
{q:"Según Pablo, ¿qué debía preceder al retorno de Cristo?",a:["La apostasía y la manifestación del hombre de pecado","La conversión de todos los gobiernos","La desaparición de toda iglesia","La restauración del Imperio Romano"],c:0,e:"2 Tesalonicenses 2 enseña que la apostasía precede al día del Señor."},
{q:"¿Cómo describe Hechos 20:29-30 a quienes distorsionarían la enseñanza en la iglesia?",a:["Como lobos rapaces que arrastrarían discípulos tras sí","Como pastores fieles sin oposición","Como mensajeros enviados por Roma","Como creyentes incapaces de influir"],c:0,e:"Pablo advirtió que entrarían lobos rapaces y surgirían hombres que hablarían cosas perversas."},
{q:"¿Qué cambio gradual describe el capítulo en el liderazgo de la iglesia?",a:["El servicio local dio paso al autoritarismo y a una jerarquía sacerdotal","La autoridad humana desapareció por completo","Los laicos asumieron toda autoridad política","La iglesia dejó de tener dirigentes"],c:0,e:"El texto describe la sustitución del liderazgo de servicio por autoridad concentrada y jerarquía."},
{q:"¿Qué papel llegó a desempeñar el obispo de Roma con el apoyo del emperador?",a:["Fue reconocido como cabeza visible de la iglesia universal","Fue elegido sumo sacerdote de Israel","Renunció a toda autoridad eclesiástica","Se convirtió en dirigente de la Reforma"],c:0,e:"El capítulo señala que el obispo de Roma llegó a ser reconocido como cabeza visible de la iglesia universal."},
{q:"¿Qué favoreció la entrada de prácticas paganas en la iglesia, según el capítulo?",a:["La popularidad de la iglesia y la incorporación de multitudes con poco conocimiento del cristianismo","La traducción de la Biblia al inglés","La oposición de los reformadores","La caída de Babilonia"],c:0,e:"El crecimiento en popularidad y las normas rebajadas facilitaron la entrada de creencias y prácticas paganas."},
{q:"¿Qué fecha marca el inicio de los 1.260 años de persecución en el relato histórico presentado?",a:["538 d.C.","1798 d.C.","533 d.C.","1517 d.C."],c:0,e:"El capítulo relaciona el inicio del período con 538, cuando el obispo de Roma pudo ejercer mayor autoridad."},
{q:"¿Qué acontecimiento señala el final de los 1.260 años en 1798?",a:["La captura del Papa por las fuerzas francesas y la herida mortal al poder político papal","La publicación de la Biblia en inglés","El inicio del Concilio de Jerusalén","La caída de Constantinopla"],c:0,e:"En 1798 el general Berthier tomó cautivo al Papa, hecho interpretado como el fin del período profético."},
{q:"¿Qué evento religioso importante nació en el siglo XVI como respuesta a la negativa de reformarse?",a:["La Reforma protestante","El movimiento de los apóstoles","La construcción del templo de Jerusalén","La Contrarreforma"],c:0,e:"La negativa de la iglesia a reformarse provocó el nacimiento de la Reforma protestante."},
{q:"¿Qué hizo Juan Wiclef que ayudó a preparar la Reforma?",a:["Proveyó la primera traducción completa de las Escrituras al inglés","Estableció la doctrina de indulgencias","Dirigió la captura del Papa en 1798","Escribió los mensajes de Apocalipsis 14"],c:0,e:"Wiclef tradujo por primera vez el texto completo de las Escrituras al inglés y defendió la salvación por fe."},
{q:"¿Qué énfasis de la Reforma se asocia especialmente con Martín Lutero?",a:["La justificación por la fe y la autoridad de las Escrituras","La salvación por indulgencias","La tradición como autoridad suprema","La mediación exclusiva de sacerdotes humanos"],c:0,e:"Lutero dirigió al pueblo a las Escrituras y a la justificación por la fe."},
{q:"¿Qué principio reformador se expresa en “la Biblia y la Biblia sola”?",a:["Las Escrituras son la norma final de fe y conducta","La tradición eclesiástica está sobre la Biblia","Cada dirigente puede cambiar la doctrina","La conciencia debe someterse a los reyes"],c:0,e:"Los reformadores sujetaban las tradiciones humanas a la autoridad final de las Escrituras."},
{q:"¿Por qué dice el capítulo que la Reforma se estancó?",a:["Muchos sucesores dejaron de avanzar en el estudio bíblico y se aferraron a las posiciones de los primeros reformadores","Los reformadores rechazaron toda Biblia","La iglesia no tenía creyentes","Se prohibió la libertad religiosa en todas partes"],c:0,e:"Los sucesores consolidaron logros, se centraron en opiniones de reformadores y dejaron de buscar más luz bíblica."},
{q:"¿Qué es el remanente según la descripción bíblica del capítulo?",a:["Un grupo del pueblo de Dios que permanece leal durante calamidades, guerras y apostasía","La totalidad de los gobiernos del mundo","Una organización sin relación con la iglesia","Un grupo que nunca enfrenta dificultades"],c:0,e:"El remanente es un residuo fiel que permanece leal a Dios a través de crisis y apostasía."},
{q:"¿Qué pasaje se usa para describir al remanente como quienes guardan los mandamientos y tienen el testimonio de Jesús?",a:["Apocalipsis 12:17","Génesis 1:1","Mateo 5:3","Hechos 2:1"],c:0,e:"Apocalipsis 12:17 presenta esas características del remanente."},
{q:"¿Cuál es una característica del remanente llamada “la fe de Jesús”?",a:["Confianza en Dios y en la autoridad de las Escrituras, semejante a la de Jesús","Confianza en el poder político","Rechazo de las verdades bíblicas que Jesús enseñó","Fe basada en tradiciones humanas"],c:0,e:"El remanente refleja la confianza de Jesús en Dios y la autoridad de la Escritura."},
{q:"¿Qué relación establece el capítulo entre la fe en Jesús y los mandamientos de Dios?",a:["La fe genuina lleva a seguir el ejemplo de Jesús y obedecer los mandamientos","La fe vuelve innecesaria toda obediencia","La obediencia permite prescindir de Cristo","Los mandamientos solo se aplicaban a Israel"],c:0,e:"La fe en Jesús compromete al creyente a andar como él anduvo y guardar los mandamientos."},
{q:"¿Cómo define Juan “el testimonio de Jesús” en Apocalipsis 19:10?",a:["El espíritu de profecía","La autoridad del emperador","La tradición de los concilios","La predicación de los ángeles"],c:0,e:"Apocalipsis 19:10 identifica el testimonio de Jesús como el espíritu de profecía."},
{q:"¿Hasta cuándo debía funcionar el don profético en la iglesia según Efesios 4:13?",a:["Hasta que los creyentes lleguen a la unidad de la fe y a la plenitud de Cristo","Solo hasta la conversión de Pablo","Hasta la caída de Roma","Únicamente durante la vida de los apóstoles"],c:0,e:"El capítulo cita Efesios 4:13 para indicar que el don continúa hasta la madurez y unidad en Cristo."},
{q:"¿En qué momento aparece el remanente de los últimos días según Apocalipsis 12?",a:["Después del período de la gran persecución","Antes de la iglesia apostólica","Durante el éxodo de Egipto","Antes de la primera venida de Cristo"],c:0,e:"La Biblia sitúa al remanente después del tiempo de la gran persecución."},
{q:"¿Qué impulsó el reavivamiento del estudio profético en los siglos XVIII y XIX?",a:["Acontecimientos vinculados al fin de los 1.260 años y señales que apuntaban al regreso de Cristo","La caída de Jerusalén en tiempos de Babilonia","La construcción de iglesias en Roma","La elección de los siete diáconos"],c:0,e:"Los sucesos de 1798 y señales cósmicas despertaron interés en las profecías y la segunda venida."},
{q:"¿Qué carácter tuvo el movimiento adventista descrito en el capítulo?",a:["Interconfesional, centrado en la Biblia y en la esperanza del advenimiento","Limitado a una sola denominación desde su inicio","Político y centrado en el gobierno","Desinteresado en el estudio bíblico"],c:0,e:"El capítulo describe un movimiento interconfesional centrado en la Palabra y la esperanza del regreso de Cristo."},
{q:"¿Cómo entendieron los creyentes las pruebas y los chascos que atravesaron?",a:["Como una experiencia purificadora que los unió para continuar la reforma","Como prueba de que debían abandonar la Biblia","Como motivo para considerarse superiores","Como razón para renunciar a la misión"],c:0,e:"El texto presenta esas experiencias como purificadoras y unificadoras, y subraya humildad y dependencia de la gracia."},
{q:"¿Qué representan los tres ángeles de Apocalipsis 14 en la misión del remanente?",a:["La proclamación mundial de la última amonestación de Dios","Tres gobiernos que controlan la iglesia","La historia de los doce apóstoles","La desaparición de la predicación"],c:0,e:"Los tres mensajes simbolizan la proclamación final del remanente antes del regreso de Cristo."},
{q:"¿Qué contiene el mensaje del primer ángel?",a:["El evangelio eterno, el anuncio de la hora del juicio y el llamado a adorar al Creador","Una fecha para calcular el regreso de Cristo","Una invitación a adorar a la bestia","Una enseñanza nueva separada de la Biblia"],c:0,e:"Apocalipsis 14:6-7 une el evangelio eterno, el juicio y la adoración al Creador."},
{q:"¿Presenta el remanente un evangelio diferente al anunciado por profetas y apóstoles?",a:["No; reafirma el evangelio eterno de salvación por fe en Cristo","Sí; reemplaza la gracia con obras","Sí; elimina la necesidad de Cristo","No; deja de predicar el evangelio"],c:0,e:"El mensaje del primer ángel reafirma las buenas nuevas eternas de justificación por la fe."},
{q:"En el mensaje del primer ángel, ¿qué significa dar gloria a Dios en la vida cotidiana?",a:["Honrarlo con palabras y acciones, llevando fruto y cuidando la vida como suya","Buscar reconocimiento para uno mismo","Adorar solo durante ceremonias públicas","Confiar en el mérito humano"],c:0,e:"El capítulo aplica el llamado a glorificar a Dios a las palabras, acciones y mayordomía de la vida."},
{q:"¿Qué quiere decir la palabra griega krísis usada para “la hora de su juicio”?",a:["El acto o proceso de juzgar","La sentencia final solamente","Un período de mil años","La acusación de Satanás"],c:0,e:"El capítulo explica que krísis se refiere al proceso de juzgar, no solo a la sentencia."},
{q:"¿A qué invita el primer mensaje respecto a la adoración?",a:["A adorar al Creador y reconocerlo como Señor del sábado bíblico","A adorar a la bestia y su imagen","A reemplazar la adoración por tradiciones humanas","A evitar toda adoración comunitaria"],c:0,e:"El mensaje llama a adorar al Creador y destaca el sábado como memorial de la creación."},
{q:"¿Qué significa Babilonia en el mensaje del segundo ángel?",a:["Organizaciones religiosas apóstatas y sus dirigentes, especialmente la alianza final descrita en Apocalipsis","La iglesia apostólica fiel","La ciudad celestial de Sion","El pueblo de Israel en el desierto"],c:0,e:"El capítulo interpreta Babilonia como las organizaciones religiosas apóstatas y, de manera especial, la alianza final."},
{q:"En la explicación del capítulo, ¿qué representa el “vino” de Babilonia?",a:["Sus enseñanzas heréticas","La Cena del Señor","El evangelio eterno","La sangre de los mártires únicamente"],c:0,e:"El vino representa las enseñanzas falsas de Babilonia."},
{q:"¿Qué simboliza la “fornicación” de Babilonia con las naciones?",a:["La relación ilícita entre la iglesia apóstata y los poderes civiles","La unidad de los creyentes con Cristo","La misión de predicar a todas las naciones","La comunión entre iglesias"],c:0,e:"La imagen representa la búsqueda del apoyo del Estado por parte de la iglesia apóstata."},
{q:"¿Qué llamado de Apocalipsis 18:4 se relaciona con la caída de Babilonia?",a:["“Salid de ella, pueblo mío”","“Construid una ciudad terrenal”","“Esconded el evangelio”","“Seguid las tradiciones humanas”"],c:0,e:"El mensaje llama al pueblo de Dios a salir de Babilonia para no participar de sus pecados."},
{q:"¿Contra qué advierte el mensaje del tercer ángel?",a:["Adorar a la bestia y a su imagen y recibir su marca","Leer las Escrituras","Proclamar el evangelio eterno","Guardar los mandamientos de Dios"],c:0,e:"El tercer mensaje advierte solemnemente contra adorar a la bestia y su imagen."},
{q:"¿Qué identifica el texto como la imagen de la bestia?",a:["Una religión apóstata que se une con el Estado para imponer sus enseñanzas","La iglesia universal en el cielo","Una representación de Cristo como Creador","El remanente que guarda la fe de Jesús"],c:0,e:"La imagen representa la unión de iglesias apóstatas con el Estado para imponer creencias."},
{q:"¿Qué dos características se destacan de los santos en Apocalipsis 14:12?",a:["Paciencia, mandamientos de Dios y fe de Jesús","Poder político y riqueza","Tradición y autoridad humana","Aislamiento y temor"],c:0,e:"Apocalipsis 14:12 presenta a los santos como pacientes, guardadores de los mandamientos y poseedores de la fe de Jesús."},
{q:"¿Cuál es el asunto central del conflicto final descrito en el capítulo?",a:["La adoración verdadera o falsa y el evangelio verdadero o falso","La riqueza de las iglesias","La ubicación de los templos","La elección de dirigentes civiles"],c:0,e:"El texto resume el conflicto final como una elección entre culto verdadero o falso y evangelio verdadero o falso."},
{q:"¿Cómo relaciona el capítulo el mensaje del tercer ángel con la justificación por la fe?",a:["Llama a confiar plenamente en Dios y a adorarlo como Creador, Redentor y Recreador","Enseña que las obras humanas compran la salvación","Rechaza el evangelio eterno del primer ángel","Sustituye la fe por obediencia al Estado"],c:0,e:"El mensaje del tercer ángel se interpreta también como un llamado a la justificación por la fe y a la entrega a Dios."},
{q:"¿Qué reconoce humildemente el remanente acerca de sí mismo?",a:["Sus defectos y debilidades, y su dependencia de la gracia de Dios","Su superioridad inherente sobre todos los demás","Que no necesita arrepentimiento ni reforma","Que puede cumplir su misión sin Cristo"],c:0,e:"El capítulo dice que los miembros del remanente reconocen sus faltas y dependen de la gracia de Dios."},
{q:"¿Cuál es el propósito del testimonio mundial del remanente?",a:["Preparar a las personas para el regreso de Cristo y llamar a la restauración del verdadero culto","Imponer una autoridad política mundial","Aislar a los creyentes de otras personas","Anunciar que la historia ya terminó"],c:0,e:"El remanente comparte el evangelio, llama a salir de la apostasía y prepara al mundo para el regreso de Cristo."}
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){questions=shuffle(bank.map(q=>{const opts=shuffle(q.a.map((text,i)=>({text,correct:i===q.c})));return {...q,a:opts.map(x=>x.text),c:opts.findIndex(x=>x.correct)}}));answers=Array(questions.length).fill(null);at=0;submitted=false;$("result").classList.add('hidden');$("quiz").classList.remove('hidden');render()}
function render(){const q=questions[at];$("counter").textContent=`Pregunta ${at+1} de ${questions.length}`;$("answered").textContent=`Respondidas: ${answers.filter(x=>x!==null).length}`;$("bar").style.width=`${((at+1)/questions.length)*100}%`;$("prompt").textContent=q.q;const box=$("options");box.innerHTML="";q.a.forEach((txt,i)=>{const b=document.createElement('button');b.className='opt';if(answers[at]===i)b.classList.add('selected');if(submitted&&i===q.c)b.classList.add('correct');if(submitted&&answers[at]===i&&i!==q.c)b.classList.add('wrong');b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>${txt}`;b.disabled=submitted;b.onclick=()=>{answers[at]=i;render()};box.appendChild(b)});const f=$("feedback");if(submitted){f.className='feedback '+(answers[at]===q.c?'good':'bad');f.textContent=(answers[at]===q.c?'¡Correcto! ':'Respuesta correcta: '+q.a[q.c]+'. ')+q.e}else{f.className='feedback hidden';f.textContent=''}$("prev").disabled=at===0;$("next").classList.toggle('hidden',at===questions.length-1);$("finish").classList.toggle('hidden',submitted||at!==questions.length-1);$("finish").disabled=answers.some(x=>x===null);$("next").disabled=answers[at]===null;$("tip").textContent=submitted?'Revisión de respuestas':'Elige una alternativa para continuar'}
$("prev").onclick=()=>{if(at>0){at--;render()}};$("next").onclick=()=>{if(at<questions.length-1){at++;render()}};$("finish").onclick=showResult;
function showResult(){submitted=true;const score=answers.reduce((n,x,i)=>n+(x===questions[i].c?1:0),0),pct=Math.round(score/questions.length*100);$("quiz").classList.add('hidden');const r=$("result");r.classList.remove('hidden');const msg=pct>=90?'Dominio excelente del capítulo.':pct>=75?'Buen trabajo; revisa las preguntas falladas.':pct>=60?'Vas avanzando; repasa los temas que te costaron.':'Conviene repasar el capítulo y volver a intentarlo.';r.innerHTML=`<div class="result"><div class="eyebrow">Resultado</div><div class="score">${score}<span style="font-size:1.5rem;color:#66748b"> / 50</span></div><h2>${pct}% de aciertos</h2><p>${msg}</p><button class="button" id="reviewBtn">Revisar respuestas</button> <button class="button ghost" id="againBtn">Nuevo orden aleatorio</button></div><div class="summary" id="summary"></div>`;$("reviewBtn").onclick=()=>{r.classList.add('hidden');$("quiz").classList.remove('hidden');at=0;render()};$("againBtn").onclick=start;const list=$("summary");questions.forEach((q,i)=>{const el=document.createElement('div');el.className='review';el.innerHTML=`<strong>${i+1}. ${q.q}</strong><span class="${answers[i]===q.c?'right':'your'}">Tu respuesta: ${q.a[answers[i]]}</span>${answers[i]===q.c?'':'<br><span class="right">Correcta: '+q.a[q.c]+'</span>'}<br><span class="small">${q.e}</span>`;list.appendChild(el)})}
start();
</script></body></html>
