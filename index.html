<script>
const bank=[
{q:"Según la definición inicial, ¿quiénes forman la iglesia?",a:["La comunidad de creyentes que confiesan que Jesucristo es Señor y Salvador","Solo los dirigentes ordenados","Todas las personas de una nación particular","Quienes se reúnen sin confesar a Cristo"],c:0,e:"El capítulo define la iglesia como la comunidad de creyentes que confiesan a Jesucristo como Señor y Salvador."},
{q:"¿Cuál actividad se menciona como propósito de reunirse como iglesia?",a:["Adorar, tener comunión, recibir instrucción bíblica, servir y proclamar el evangelio","Buscar poder político sobre las naciones","Reemplazar la misión por actividades privadas","Evitar todo contacto con la humanidad"],c:0,e:"La introducción enumera adoración, comunión, instrucción, Cena del Señor, servicio y proclamación del evangelio."},
{q:"¿De quién recibe autoridad la iglesia?",a:["De Cristo, la Palabra encarnada, y de las Escrituras, la Palabra escrita","De sus costumbres culturales","De un líder humano independiente","De la opinión de la mayoría, aunque contradiga la Biblia"],c:0,e:"El resumen del capítulo identifica a Cristo y las Escrituras como fuentes de autoridad."},
{q:"En el episodio de Números 20, ¿qué error cometió Moisés?",a:["Se atribuyó el crédito por el agua en vez de dirigirlo a Dios","Se negó a dar agua al pueblo","Destruyó la roca antes de hablar","Abandonó a Israel en el desierto"],c:0,e:"Moisés pecó al tomar para sí el crédito por el don del agua."},
{q:"¿A quién identifica Pablo como la Roca espiritual que acompañó a Israel?",a:["A Cristo","A Moisés","A David","A Abraham"],c:0,e:"1 Corintios 10:4 identifica la roca espiritual como Cristo."},
{q:"¿Sobre quién dijo Jesús que edificaría su iglesia?",a:["Sobre la Roca viviente, Cristo","Sobre la sabiduría humana de los discípulos","Sobre una nación terrenal","Sobre las tradiciones de los ancianos"],c:0,e:"El capítulo explica que Jesús estableció la iglesia sobre sí mismo, la Roca viviente."},
{q:"¿Qué significa el término griego ekklēsía según el capítulo?",a:["Un llamado a reunión o asamblea","Un edificio de piedra","Un cargo de supervisión","Una ceremonia de iniciación"],c:0,e:"Ekklēsía se explica como un llamado a reunión y se usaba para una asamblea convocada."},
{q:"¿Qué palabra hebrea traduce ekklēsía en la Septuaginta?",a:["Qāhāl","Koinonía","Presbýteros","Diákonos"],c:0,e:"La Septuaginta empleaba ekklēsía para traducir qāhāl, que significa reunión o congregación."},
{q:"¿Cuál es una de las formas en que el Nuevo Testamento usa la palabra “iglesia”?",a:["Para creyentes reunidos en un lugar específico","Únicamente para un edificio dedicado al culto","Solo para la iglesia celestial","Exclusivamente para los apóstoles"],c:0,e:"El término puede referirse a creyentes reunidos, una localidad, una casa, una región o toda la comunidad de fe."},
{q:"¿Cómo describe la Biblia la naturaleza de la iglesia?",a:["Como una institución divina","Como una institución creada solo por el Estado","Como una asociación sin autoridad espiritual","Como una organización temporal sin misión"],c:0,e:"El capítulo la llama la iglesia del Señor y la iglesia de Dios, una institución divina."},
{q:"¿Cuál era la misión de Israel, heredada de la promesa a Abraham?",a:["Ser una bendición para todas las naciones","Aislarse de los demás pueblos","Conquistar todas las naciones","Limitar la adoración a una sola familia"],c:0,e:"La misión de Israel extendía el llamado dado a Abraham: ser una bendición para las naciones."},
{q:"¿Qué quería Dios que hiciera Israel desde Palestina?",a:["Invitar a otras naciones a conocer y adorar al Dios verdadero","Evitar todo intercambio con otros pueblos","Guardar la verdad solo para sí","Trasladar el centro de adoración a Egipto"],c:0,e:"Dios llamó a Israel a salir con el fin de llamar a las naciones a entrar."},
{q:"¿Qué factores contribuyeron a que Israel no cumpliera su misión?",a:["Idolatría, aislamiento, nacionalismo, orgullo y exaltación propia","Demasiada atención al servicio de otras naciones","Exceso de humildad y comunión","Falta de organización política únicamente"],c:0,e:"El texto enumera esos factores como causas del fracaso de la misión de Israel."},
{q:"¿Qué acontecimiento inauguró la iglesia cristiana y su misión?",a:["La resurrección de Cristo","La salida de Abraham de Ur","La construcción del templo de Jerusalén","La elección de Saúl como rey"],c:0,e:"El capítulo dice que la cruz señaló el fin de la misión de Israel y la resurrección inauguró la iglesia cristiana."},
{q:"¿Qué mandato resume la misión universal de la iglesia del Nuevo Testamento?",a:["Hacer discípulos a todas las naciones","Servir solo a una nación","Construir templos en cada ciudad","Preservar una identidad nacional"],c:0,e:"Mateo 28:19 presenta el mandato de hacer discípulos a todas las naciones."},
{q:"En la metáfora del cuerpo, ¿qué representa Cristo?",a:["La cabeza del cuerpo, que es la iglesia","Un miembro más entre los creyentes","El edificio donde se reúne la iglesia","El ciudadano de la Jerusalén terrenal"],c:0,e:"Cristo es la cabeza del cuerpo y los creyentes son sus miembros."},
{q:"¿Por qué recibe cada creyente un don espiritual según la metáfora del cuerpo?",a:["Para cumplir una función vital y contribuir a la misión común","Para competir por autoridad sobre otros","Para demostrar superioridad personal","Para reemplazar el servicio de los demás"],c:0,e:"Cada don permite al miembro cumplir una función vital para la iglesia."},
{q:"En la metáfora del templo, ¿quién es el fundamento y la principal piedra del ángulo?",a:["Jesucristo","El apóstol Pedro como persona","El dirigente local","La congregación más antigua"],c:0,e:"Cristo es el fundamento y la principal piedra del ángulo del templo espiritual."},
{q:"¿Qué son los creyentes en la imagen de la iglesia como templo?",a:["Piedras vivas que se edifican como casa espiritual","Ladrillos sin vida bajo autoridad humana","Visitantes que no participan en la comunidad","Columnas que no dependen de Cristo"],c:0,e:"Pedro describe a los creyentes como piedras vivas que sirven para edificar una casa espiritual."},
{q:"¿Qué énfasis principal hace la metáfora del templo?",a:["La santidad de la congregación y de la iglesia en general","La riqueza material de los edificios","La autoridad civil de la iglesia","La uniformidad de todos los miembros"],c:0,e:"El templo de Dios es santo; esa imagen resalta la santidad de la iglesia."},
{q:"¿Qué representa la iglesia en la metáfora de la novia?",a:["La novia de Cristo, quien la ama y se entregó por ella","Una organización política sin vínculo con Cristo","La madre de los apóstoles","Un grupo que se purifica por méritos propios"],c:0,e:"Cristo es presentado como novio y la iglesia como novia por la cual se entregó."},
{q:"¿Con qué propósito se entregó Cristo por la iglesia, según Efesios 5?",a:["Para santificarla y purificarla","Para convertirla en una nación terrenal","Para eliminar su misión de servicio","Para que no necesite la Palabra"],c:0,e:"Cristo se entregó para santificar y purificar a la iglesia por la Palabra."},
{q:"¿Qué significa la imagen de la “Jerusalén de arriba”?",a:["La comunidad espiritual cuya ciudadanía está en los cielos","La ciudad terrenal gobernada por Roma","Un templo construido por Salomón","Una nación limitada por fronteras"],c:0,e:"La iglesia es descrita como la Jerusalén celestial y sus ciudadanos tienen ciudadanía en los cielos."},
{q:"¿Cómo llegan los individuos a formar parte de la familia de Dios?",a:["Por adopción y nuevo nacimiento mediante la fe en Cristo","Por nacionalidad y linaje familiar","Por ocupar un cargo en la iglesia","Por cumplir tradiciones humanas"],c:0,e:"El capítulo usa adopción y nuevo nacimiento para describir cómo nos unimos a la familia de Dios."},
{q:"¿Qué significa koinonía en la descripción de la iglesia como familia?",a:["Comunidad o comunión en el evangelio","Un cargo de anciano","Una clase de edificio","Una forma de disciplina"],c:0,e:"La comunión cristiana es más que sociabilidad; es comunión en el evangelio."},
{q:"¿Qué implica la iglesia como familia respecto a sus miembros?",a:["Amor, respeto, responsabilidad y apoyo mutuo sin perder la individualidad","Que todos tengan las mismas habilidades y personalidad","Que cada miembro viva aislado","Que solo los dirigentes puedan servir"],c:0,e:"La familia eclesiástica brinda pertenencia y apoyo, y aprende a vivir en unidad sin perder individualidad."},
{q:"¿Cómo llama 1 Timoteo 3:15 a la iglesia del Dios viviente?",a:["Columna y baluarte de la verdad","Piedra angular del Estado","Tribunal de todas las naciones","Escuela de filosofía"],c:0,e:"La iglesia es llamada columna y baluarte de la verdad."},
{q:"¿Cómo debe evaluarse una enseñanza que se presenta como “nueva luz”?",a:["Probándola con la regla de las Escrituras","Aceptándola por la popularidad de quien la propone","Rechazándola sin examinarla","Midiéndola según tradiciones culturales"],c:0,e:"Los miembros con experiencia deben probar toda nueva enseñanza con las Escrituras."},
{q:"¿Qué sucede si una supuesta nueva luz no se ajusta a las Escrituras?",a:["La iglesia debe rechazarla","Debe aceptarla para evitar desacuerdos","Debe convertirla en tradición","Debe ocultar el asunto"],c:0,e:"La regla bíblica exige aceptar lo que se ajusta a la Escritura y rechazar lo que no."},
{q:"¿Qué comunica la metáfora de la iglesia como ejército?",a:["La iglesia enfrenta una batalla espiritual y debe tomar toda la armadura de Dios","La iglesia debe luchar contra seres humanos","La iglesia debe buscar dominio militar","La iglesia no necesita perseverancia"],c:0,e:"La lucha es espiritual, no contra sangre y carne, y requiere la armadura de Dios."},
{q:"¿Hasta cuándo continúa dentro de la iglesia el conflicto representado por el trigo y la cizaña?",a:["Hasta el tiempo de la cosecha","Hasta la primera reunión de la iglesia","Hasta que desaparezca toda diversidad","Hasta que se organice el primer concilio"],c:0,e:"La parábola enseña que trigo y cizaña crecen juntos hasta la siega."},
{q:"¿Qué seguridad dio Jesús a quienes perseveran hasta el fin?",a:["Serán salvos","Nunca enfrentarán tribulación","No necesitarán fe","Recibirán autoridad civil"],c:0,e:"Mateo 24:13 se cita como promesa para quienes perseveren hasta el fin."},
{q:"¿Qué diferencia básica hay entre la iglesia visible y la invisible?",a:["La visible es el pueblo organizado para el servicio; la invisible incluye a todos los hijos de Dios","La visible es celestial y la invisible es solo local","La visible no tiene misión y la invisible administra la iglesia","Son dos nombres para el edificio de culto"],c:0,e:"El capítulo distingue la iglesia organizada para servir de la comunidad universal de los hijos de Dios."},
{q:"¿Cómo también se llama a la iglesia invisible?",a:["La iglesia universal","La iglesia local","La iglesia militante","La congregación en el desierto"],c:0,e:"La iglesia invisible también recibe el nombre de iglesia universal."},
{q:"¿Quiénes pueden estar incluidos en la iglesia invisible?",a:["Personas que han respondido positivamente a la luz que Cristo les concedió, aun sin pertenecer a una organización religiosa","Solo los miembros de una congregación local","Únicamente los dirigentes ordenados","Solo quienes vivieron en tiempos bíblicos"],c:0,e:"El capítulo incluye a quienes siguieron la luz recibida, incluso si no pertenecen a una organización religiosa."},
{q:"¿Puede el ser humano determinar con precisión quién pertenece a la iglesia invisible?",a:["No; la verdadera adoración es espiritual y Dios conoce los corazones","Sí; basta revisar la lista de miembros","Sí; basta conocer el lugar de culto","No; nadie puede pertenecer a la iglesia de Dios"],c:0,e:"La naturaleza espiritual de la adoración impide que los seres humanos calculen con precisión quién pertenece."},
{q:"¿Qué procura hacer Dios con quienes pertenecen a la iglesia invisible?",a:["Llevarlos a la unión con su iglesia visible","Mantenerlos separados de toda comunidad","Impedir que participen en la misión","Sustituir la iglesia visible por grupos privados"],c:0,e:"El capítulo dice que Dios conduce a su pueblo de la iglesia invisible a unirse con la iglesia visible."},
{q:"¿Por qué necesita la iglesia una organización sencilla pero efectiva?",a:["Para enseñar y cuidar a los nuevos creyentes y cumplir la misión con orden","Para dar poder independiente a los dirigentes","Para reemplazar los dones espirituales","Para limitar la proclamación del evangelio"],c:0,e:"La organización ayuda a establecer a los nuevos miembros y hacer todo decentemente y con orden."},
{q:"¿Qué implica la feligresía de la iglesia?",a:["Aceptar nuevas relaciones con el prójimo, el Estado y Dios","Abandonar toda responsabilidad con la sociedad","Obtener privilegios sobre otros creyentes","Evitar el servicio a los demás"],c:0,e:"La feligresía implica nuevas relaciones con el prójimo, el Estado y Dios."},
{q:"¿Cuáles son requisitos de feligresía mencionados en el capítulo?",a:["Aceptar a Cristo como Señor y Salvador, arrepentirse y ser bautizado","Pertenecer a una familia específica y tener un cargo","Dominar todas las doctrinas antes de creer","Tener ciudadanía en Israel"],c:0,e:"El texto enumera aceptar a Cristo, arrepentirse y ser bautizado; también señala el nuevo nacimiento y la misión."},
{q:"Según Jesús, ¿sobre qué base deben relacionarse los miembros de la iglesia?",a:["Como hermanos e iguales, sirviendo a otros","Sobre una base de rango y dominio","Con independencia absoluta unos de otros","Según riqueza y educación"],c:0,e:"Jesús enseñó que todos son hermanos y que el mayor debe ser servidor."},
{q:"¿Qué significa el sacerdocio de todos los creyentes?",a:["Cada miembro ministra a otros y puede comunicarse directamente con Dios","Cada miembro puede enseñar cualquier cosa sin rendir cuentas","No existen funciones diferentes en la iglesia","Solo los ministros pueden servir a Dios"],c:0,e:"El sacerdocio de todos los creyentes destaca la responsabilidad de ministrar y el acceso directo a Dios, en interdependencia con la iglesia."},
{q:"¿Qué debe hacer el creyente si el Estado contradice un mandato divino?",a:["Obedecer a Dios antes que a los hombres","Obedecer siempre al Estado sin excepción","Retirarse de toda sociedad","Dejar que cada persona decida según su conveniencia"],c:0,e:"Hechos 5:29 establece la lealtad fundamental a Dios cuando existe ese conflicto."},
{q:"¿Para qué fue organizada principalmente la iglesia?",a:["Para cumplir el plan de Dios de llenar el planeta con el conocimiento de su gloria","Para obtener influencia política","Para reemplazar el ministerio de Cristo","Para ocuparse solo de sus miembros"],c:0,e:"La organización eclesiástica sirve al plan de Dios y a la misión mundial."},
{q:"¿Cuál es una función de la organización eclesiástica?",a:["Reunir a los creyentes para adorar y exhortarse mutuamente","Separar a los creyentes de la comunión","Evitar la instrucción bíblica","Impedir la misión a otras naciones"],c:0,e:"La adoración congregacional ofrece refrigerio, ánimo y gozo, y los creyentes se exhortan mutuamente."},
{q:"En el capítulo, ¿qué son las “llaves del reino de los cielos”?",a:["Las palabras de Cristo y las enseñanzas de la Biblia","Los cargos de los dirigentes","Las tradiciones de cada cultura","Las decisiones civiles"],c:0,e:"El texto identifica las llaves con las palabras de Cristo, la Biblia y la instrucción que muestra cómo entrar al reino."},
{q:"¿Qué ordenanzas administra la iglesia según el capítulo?",a:["Bautismo, lavamiento de los pies y Cena del Señor","Circuncisión, sacrificios y peregrinación","Coronación y juramento civil","Ayuno y voto monástico como requisitos de ingreso"],c:0,e:"La iglesia administra el bautismo y las ordenanzas del lavamiento de los pies y la Cena del Señor."},
{q:"¿Cuál es el mayor servicio de la iglesia para el mundo?",a:["Entregarse a completar la predicación del evangelio a todas las naciones","Construir edificios cada vez mayores","Promover una cultura nacional","Mantener sus recursos solo para sus miembros"],c:0,e:"El capítulo presenta la proclamación mundial del evangelio como el mayor servicio de la iglesia."},
{q:"¿Por qué los apóstoles delegaron algunos asuntos prácticos a siete hombres?",a:["Para poder persistir en la oración y el ministerio de la Palabra","Para excluir a los laicos de la misión","Para terminar la predicación pública","Para reemplazar a los apóstoles"],c:0,e:"Hechos 6 describe la delegación para que los apóstoles se dedicaran a la oración y al ministerio de la Palabra."},
{q:"¿Qué función cumplía el concilio de Jerusalén en Hechos 15?",a:["Resolver una crisis mediante consejo y consenso de representantes de la iglesia","Elegir un rey para Israel","Reemplazar las Escrituras por una nueva tradición","Limitar la misión a los judíos"],c:0,e:"El concilio consideró el asunto de manera amplia y llegó a una decisión aceptada por la iglesia."},
{q:"¿Quién es la cabeza de la iglesia y fuente de su autoridad?",a:["Cristo","El anciano local","El concilio por sí solo","El Estado"],c:0,e:"El capítulo enfatiza que Cristo es la cabeza y fuente de toda autoridad de la iglesia."},
{q:"¿Cuál es la única regla por la cual la iglesia debe guiar sus actividades?",a:["La Palabra de Dios","Las costumbres humanas","La preferencia de los dirigentes","La práctica más popular"],c:0,e:"Las Escrituras poseen la autoridad de Cristo y son la única regla para guiar las actividades de la iglesia."},
{q:"¿Qué cargos eclesiásticos menciona el Nuevo Testamento en el capítulo?",a:["Ancianos y diáconos","Reyes y jueces","Cardenales y obispos metropolitanos","Profetas y escribas como únicos cargos"],c:0,e:"El capítulo indica que el Nuevo Testamento menciona dos cargos: anciano y diácono."},
{q:"¿Qué significa el término “obispo” en la explicación sobre los ancianos?",a:["Supervisor","Siervo de mesa","Maestro de canto","Miembro nuevo"],c:0,e:"Epískopos significa supervisor; presbítero se refiere al rango de anciano."},
{q:"¿Cuál es una responsabilidad espiritual del anciano?",a:["Apacentar la iglesia y apoyar a los miembros","Controlar la conciencia de los creyentes","Reemplazar a Cristo como cabeza","Administrar el Estado"],c:0,e:"El anciano es un dirigente espiritual que cuida a la iglesia, apoya a los débiles y amonesta a los desviados."},
{q:"¿Para qué se instituyó el oficio de diácono?",a:["Para ayudar con el servicio de la iglesia y permitir que los apóstoles se dedicaran a la oración y la Palabra","Para reemplazar a los ancianos en la enseñanza","Para ejercer autoridad independiente de Cristo","Para excluir el evangelismo de sus tareas"],c:0,e:"El servicio de los diáconos atendía necesidades prácticas y también podía incluir obra evangelizadora."},
{q:"¿Cómo se debe abordar primero una ofensa privada, según Mateo 18?",a:["La persona ofendida debe hablar en privado con quien la ofendió","Se debe anunciar inmediatamente ante toda la comunidad","Se debe ignorar y difundir el rumor","Se debe expulsar al ofensor sin hablar con él"],c:0,e:"Jesús aconseja acercarse primero al ofensor y procurar persuadirlo a cambiar."},
{q:"Si el primer intento por resolver una ofensa privada falla, ¿qué sigue?",a:["Intentar nuevamente con uno o dos testigos neutrales","Publicar la acusación en toda la comunidad","Abandonar para siempre la relación","Desfraternizarlo sin más pasos"],c:0,e:"Mateo 18 propone volver con uno o dos testigos antes de llevar el asunto ante la iglesia."},
{q:"¿Cómo deben tratarse las ofensas públicas flagrantes y rebeldes?",a:["Deben enfrentarse con prontitud para proteger la pureza de la iglesia y procurar la redención","Deben ocultarse indefinidamente","Deben celebrarse como libertad personal","Deben tratarse solo mediante rumores"],c:0,e:"El capítulo señala que las ofensas públicas graves requieren acción inmediata y disciplina redentora."},
{q:"¿Qué actitud recomienda el capítulo hacia una persona que causa divisiones?",a:["Amonestarla como a hermano, sin considerarla enemiga","Despreciarla y aislarla para siempre","Permitir que siga causando divisiones","Atacarla públicamente sin advertencia"],c:0,e:"2 Tesalonicenses 3 recomienda amonestar al que causa desorden como a un hermano."},
{q:"¿Qué deben procurar los miembros respecto de una persona desfraternizada?",a:["Su restauración a Cristo y a la comunión si muestra arrepentimiento genuino","Ignorarla permanentemente","Impedir toda reconciliación","Restaurarla automáticamente sin considerar su actitud"],c:0,e:"El propósito redentor de la disciplina incluye procurar la restauración cuando hay evidencias de arrepentimiento genuino."}
];
const $=id=>document.getElementById(id);let questions=[],at=0,answers=[],submitted=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){questions=shuffle(bank.map(q=>{let choices=shuffle(q.a.map((text,i)=>({text,correct:i===q.c})));return {...q,a:choices.map(x=>x.text),c:choices.findIndex(x=>x.correct)}})).slice(0,50);answers=Array(questions.length).fill(null);at=0;submitted=false;$("result").classList.add('hidden');$("quiz").classList.remove('hidden');render()}
function render(){const q=questions[at];$("counter").textContent=`Pregunta ${at+1} de ${questions.length}`;$("answered").textContent=`Respondidas: ${answers.filter(x=>x!==null).length}`;$("bar").style.width=`${((at+1)/questions.length)*100}%`;$("prompt").textContent=q.q;const box=$("options");box.innerHTML="";q.a.forEach((txt,i)=>{const b=document.createElement('button');b.className='opt';if(answers[at]===i)b.classList.add('selected');if(submitted&&i===q.c)b.classList.add('correct');if(submitted&&answers[at]===i&&i!==q.c)b.classList.add('wrong');b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>${txt}`;b.disabled=submitted;b.onclick=()=>{answers[at]=i;render()};box.appendChild(b)});const f=$("feedback");if(submitted){f.className='feedback '+(answers[at]===q.c?'good':'bad');f.textContent=(answers[at]===q.c?'¡Correcto! ':'Respuesta correcta: '+q.a[q.c]+'. ')+q.e}else{f.className='feedback hidden';f.textContent=''}$("prev").disabled=at===0;$("next").classList.toggle('hidden',at===questions.length-1);$("finish").classList.toggle('hidden',submitted||at!==questions.length-1);$("finish").disabled=answers.some(x=>x===null);$("next").disabled=answers[at]===null;$("tip").textContent=submitted?'Revisión de respuestas':'Elige una alternativa para continuar'}
$("prev").onclick=()=>{if(at>0){at--;render()}};$("next").onclick=()=>{if(at<questions.length-1){at++;render()}};$("finish").onclick=showResult;
function showResult(){submitted=true;const score=answers.reduce((n,x,i)=>n+(x===questions[i].c?1:0),0),pct=Math.round(score/questions.length*100);$("quiz").classList.add('hidden');const r=$("result");r.classList.remove('hidden');let msg=pct>=90?'Dominio excelente del capítulo.':pct>=75?'Buen trabajo; revisa las preguntas falladas.':pct>=60?'Vas avanzando; repasa los temas que te costaron.':'Conviene repasar el capítulo y volver a intentarlo.';r.innerHTML=`<div class="result"><div class="eyebrow">Resultado</div><div class="score">${score}<span style="font-size:1.5rem;color:#66748b"> / 50</span></div><h2>${pct}% de aciertos</h2><p>${msg}</p><button class="button" id="reviewBtn">Revisar respuestas</button> <button class="button ghost" id="againBtn">Nuevo orden aleatorio</button></div><div class="summary" id="summary"></div>`;$("reviewBtn").onclick=()=>{r.classList.add('hidden');$("quiz").classList.remove('hidden');at=0;render()};$("againBtn").onclick=start;const list=$("summary");questions.forEach((q,i)=>{const el=document.createElement('div');el.className='review';el.innerHTML=`<strong>${i+1}. ${q.q}</strong><span class="${answers[i]===q.c?'right':'your'}">Tu respuesta: ${q.a[answers[i]]}</span>${answers[i]===q.c?'':'<br><span class="right">Correcta: '+q.a[q.c]+'</span>'}<br><span class="small">${q.e}</span>`;list.appendChild(el)})}
start();
</script></body></html>
