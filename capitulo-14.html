<script>
const bank=[
{q:"Según el capítulo, ¿quiénes forman el cuerpo de Cristo?",a:["Muchos miembros llamados de todas las naciones, razas, lenguas y pueblos","Solo personas de una nación","Únicamente los dirigentes de iglesia","Personas con los mismos talentos"],c:0,e:"La iglesia es un cuerpo con muchos miembros, procedentes de toda nación, raza, lengua y pueblo."},
{q:"¿Qué deben significar las diferencias sociales, culturales y de género entre los creyentes?",a:["No deben causar divisiones, porque todos son iguales en Cristo","Deben establecer rangos permanentes","Deben separar a las congregaciones","Deben determinar quién puede servir"],c:0,e:"En Cristo las diferencias no deben crear divisiones; todos son iguales y se sirven mutuamente."},
{q:"¿En qué tiene sus orígenes la unidad cristiana?",a:["En la unidad del Dios triuno que adopta a los creyentes como hijos","En una cultura común","En una estructura política","En la uniformidad de dones"],c:0,e:"El capítulo vincula el origen de la unidad con la unicidad del Dios triuno."},
{q:"¿Qué problema tenían los discípulos la noche antes de la muerte de Jesús?",a:["Discutían por quién era el mayor y quién tendría posiciones más elevadas","Se negaban a proclamar el evangelio a los judíos","No querían ser bautizados","Planeaban abandonar Jerusalén"],c:0,e:"Los celos provocaron discusiones sobre quién era el mayor en el reino de Cristo."},
{q:"¿Qué enseñanza de Jesús parecía no haber penetrado en los discípulos?",a:["La grandeza en su reino se manifiesta en humildad y servicio","El poder político es la meta del discipulado","Los pobres deben quedar fuera de la iglesia","La unidad requiere uniformidad"],c:0,e:"Jesús enseñó que sus seguidores debían ser siervos, entregándose al servicio sin buscar recompensa."},
{q:"¿Qué demostró Jesús al lavar los pies de sus discípulos?",a:["El servicio humilde que sus seguidores debían imitar","Que solo los dirigentes pueden servir","Que la unidad no requiere amor","Que las tradiciones están sobre el servicio"],c:0,e:"El lavamiento de pies fue un ejemplo de humildad y servicio abnegado."},
{q:"¿Por qué el amor de los discípulos debía distinguirlos?",a:["El mundo reconocería en ellos la revelación del amor de Cristo","Su profesión religiosa sería suficiente aunque no amaran","Tendrían más poder que otros grupos","Evitarían relacionarse con otros pueblos"],c:0,e:"Juan 13:34-35 enseña que el amor mostrado por los discípulos los identifica como seguidores de Jesús."},
{q:"¿Qué pidió Jesús al Padre en Juan 17 respecto a la iglesia?",a:["Que sus seguidores fueran uno como el Padre y el Hijo son uno","Que cada grupo trabajara por separado","Que todos tuvieran los mismos dones","Que los discípulos recibieran posiciones de honor"],c:0,e:"Jesús oró por una unidad que reflejara la unidad entre él y el Padre."},
{q:"¿Por qué la unidad es una herramienta poderosa para testificar?",a:["Muestra al mundo el amor abnegado de Cristo y su vínculo con los creyentes","Permite evitar toda obra misionera","Hace innecesaria la Biblia","Demuestra que todos piensan igual en todo"],c:0,e:"La unidad evidencia el amor de Cristo y convence al mundo de que el Padre envió al Hijo."},
{q:"¿Quién impulsa a la iglesia a la unidad y bautiza a los creyentes en un cuerpo?",a:["El Espíritu Santo","El gobierno civil","El apóstol Pedro solamente","La tradición"],c:0,e:"El Espíritu Santo lleva a los creyentes a la iglesia y los bautiza en un solo cuerpo."},
{q:"¿Cuántas veces aparece la idea de “uno” en la lista de Efesios 4:4-6 citada en el capítulo?",a:["Siete","Tres","Cinco","Doce"],c:0,e:"Pablo menciona un cuerpo, un Espíritu, una esperanza, un Señor, una fe, un bautismo y un Dios y Padre."},
{q:"Complete la lista de Efesios 4: “un cuerpo, un Espíritu… un Señor, una fe, un bautismo, un Dios y ______ de todos”.",a:["Padre","Rey","Pastor","Salvador"],c:0,e:"El pasaje dice: “un Dios y Padre de todos”."},
{q:"¿Qué efecto tiene el crecimiento en Cristo sobre las diferencias culturales?",a:["Dejan de producir divisiones entre los creyentes","Desaparecen por completo las identidades personales","Se convierten en jerarquías","Impiden la comunión"],c:0,e:"A medida que crecen en Cristo, las diferencias culturales ya no producen divisiones."},
{q:"¿Cómo describe el capítulo la relación entre iglesias locales de distintos países?",a:["Son iguales espiritualmente; la unidad no establece jerarquías entre nacionales y misioneros","Una iglesia extranjera siempre tiene autoridad superior","Las iglesias locales deben competir por recursos","Los misioneros no forman parte del cuerpo"],c:0,e:"La unidad espiritual no conoce jerarquías: nacionales y misioneros son iguales delante de Dios."},
{q:"¿Qué esperanza comparte la iglesia unida?",a:["La esperanza bienaventurada de la manifestación gloriosa de Cristo","La esperanza de dominar a las naciones","La esperanza de evitar toda dificultad","La esperanza de recibir méritos por tradición"],c:0,e:"La iglesia espera la manifestación gloriosa de Jesucristo y su salvación consumada."},
{q:"¿Qué efecto puede tener la esperanza de Cristo en el creyente?",a:["Lo lleva a purificarse a sí mismo, así como Cristo es puro","Lo libera de toda responsabilidad moral","Lo aparta de la misión","Le garantiza riqueza temporal"],c:0,e:"1 Juan 3:3 vincula la esperanza en Cristo con una vida de purificación."},
{q:"¿Qué simboliza el bautismo en relación con la unidad del cuerpo?",a:["La fe en la muerte y resurrección de Cristo y la unión del creyente con su cuerpo","La igualdad de talentos entre miembros","La desaparición de toda diferencia personal","Una autoridad superior sobre otros"],c:0,e:"El bautismo simboliza la muerte y resurrección de Cristo y expresa la unión del creyente con la iglesia."},
{q:"¿En qué está fundada la unidad eclesiástica, según 1 Corintios 12:4-6?",a:["En el mismo Espíritu, Señor y Dios que obra en todos","En la uniformidad de operaciones","En un solo ministerio humano","En la tradición de cada nación"],c:0,e:"Hay diversidad de dones, ministerios y operaciones, pero el mismo Espíritu, Señor y Dios."},
{q:"¿Qué alcance debe tener la unidad cristiana?",a:["Unidad de sentimiento, pensamiento y acción, centrada en Cristo","Uniformidad absoluta de personalidad","Acuerdo solo entre dirigentes","Unidad únicamente durante el culto"],c:0,e:"El capítulo exhorta a la unidad de sentir, pensar y actuar, sin confundirla con uniformidad."},
{q:"¿La unidad bíblica exige que todos los miembros sean iguales?",a:["No; la unidad existe en medio de la diversidad","Sí; todos deben tener el mismo don","Sí; todos deben cumplir idéntica función","No; cada uno debe actuar sin relación con el cuerpo"],c:0,e:"La metáfora del cuerpo muestra que la unidad bíblica no significa uniformidad."},
{q:"¿Por qué es útil la diversidad de dones en la iglesia?",a:["Cada don cumple una tarea distinta que beneficia a todo el cuerpo","Permite que algunos miembros no contribuyan","Establece superioridad de ciertos miembros","Reemplaza la dirección del Espíritu"],c:0,e:"Dios distribuye dones distintos para el bien de la congregación y la misión común."},
{q:"¿De qué depende el éxito de la iglesia al cumplir su misión?",a:["De que cada miembro realice la tarea que Dios le asigna","De que todos hagan la misma tarea","De la cantidad de dirigentes solamente","De que se eliminen los dones distintos"],c:0,e:"La misión requiere las contribuciones diferentes de todos los dones."},
{q:"En la metáfora de la vid, ¿quién es la Vid verdadera?",a:["Cristo","La iglesia local","El apóstol Pablo","El Espíritu Santo"],c:0,e:"Jesús es la Vid verdadera y los creyentes son los pámpanos."},
{q:"¿Qué tienen en común los pámpanos de la vid que ilustra la unidad?",a:["Reciben nutrición de la misma fuente, Cristo","Son idénticos en tamaño y función","Se absorben unos a otros","No necesitan permanecer unidos al tronco"],c:0,e:"Los pámpanos son diferentes, pero reciben su alimento de la misma Vid."},
{q:"¿De dónde viene el poder para la unidad cristiana?",a:["De la unión de los miembros con Cristo","De la diplomacia únicamente","De imponer uniformidad","De los recursos económicos"],c:0,e:"La conexión con Cristo da poder, transforma la vida y vincula a los miembros en una misión común."},
{q:"¿Qué sucede cuando los miembros permanecen en Cristo?",a:["El egoísmo se desvanece y se desarrolla la unidad cristiana","Se eliminan todos los temperamentos distintos","Los miembros dejan de servir","La iglesia ya no necesita misión"],c:0,e:"Permanecer en Cristo permite que el egoísmo ceda y la iglesia trabaje unida."},
{q:"¿Qué significa que hay muchos dones pero una sola Cabeza?",a:["Los miembros diversos trabajan bajo la dirección de Cristo","Todos los miembros tienen la misma función","Los dones no son importantes","Cada miembro dirige su propio cuerpo"],c:0,e:"Cristo dirige a la iglesia; sus miembros tienen diversos dones y funciones."},
{q:"¿La diversidad de dones implica diversidad del fundamento de la fe?",a:["No; los creyentes comparten el evangelio eterno y la fe de Jesús","Sí; cada don establece una doctrina propia","Sí; cada congregación crea su evangelio","No; la fe deja de ser necesaria"],c:0,e:"Los dones son distintos, pero la iglesia comparte el fundamento del evangelio eterno."},
{q:"¿Por qué es esencial la unidad para la iglesia?",a:["Sin ella, la iglesia fracasa en su sagrada misión","Porque elimina la necesidad de estudiar la Biblia","Porque garantiza que no habrá desacuerdos","Porque permite que solo unos pocos trabajen"],c:0,e:"El capítulo afirma que sin unidad la iglesia no cumple eficazmente su misión."},
{q:"¿Qué testifica con especial poder ante un mundo dividido?",a:["El amor y la unidad entre creyentes diversos","La competencia entre congregaciones","La uniformidad en preferencias personales","La acumulación de recursos"],c:0,e:"La unidad entre creyentes de distintos temperamentos y personalidades valida el mensaje cristiano."},
{q:"¿Qué efecto pueden tener los conflictos entre cristianos sobre los no creyentes?",a:["Pueden disgustarlos y convertirse en obstáculo para aceptar la fe","Siempre fortalecen su confianza en la iglesia","No tienen ningún efecto en el testimonio","Los obligan a unirse a la iglesia"],c:0,e:"Las divisiones han levantado obstáculos a la aceptación de la fe cristiana."},
{q:"¿Qué revela una iglesia verdaderamente unida acerca del reino de Dios?",a:["Que sus miembros toman en serio la esperanza de vivir juntos en el cielo","Que ya ha alcanzado la perfección absoluta","Que reemplaza el reino eterno","Que puede ignorar a la sociedad"],c:0,e:"La unidad actual demuestra la realidad y la esperanza del reino eterno de Dios."},
{q:"¿Qué comparación usa el capítulo para mostrar cómo funciona la unidad?",a:["Una orquesta que produce armonía al seguir a un director","Un grupo de corredores compitiendo entre sí","Un ejército sin líder","Una colección de instrumentos aislados"],c:0,e:"La orquesta representa a los creyentes que, bajo la dirección divina, producen la armonía del amor de Dios."},
{q:"¿Quién es el “divino Director” en la ilustración de la orquesta?",a:["Dios, que dirige a los llamados","El miembro más talentoso","El dirigente civil","La congregación más grande"],c:0,e:"La ilustración representa a los creyentes siguiendo la dirección de Dios."},
{q:"¿Cuáles son tres fuentes de la unidad que destaca la oración de Jesús?",a:["El poder preservador del Padre, la gloria impartida por Cristo y la presencia de Cristo en los creyentes","La administración, la diplomacia y el dinero","Los cargos, las tradiciones y la nacionalidad","La uniformidad, el aislamiento y la competencia"],c:0,e:"Juan 17 relaciona la unidad con el cuidado del Padre, la gloria dada por Cristo y su morada en los creyentes."},
{q:"¿Qué representa el eje de la rueda en la comparación sobre la unidad?",a:["Cristo","La iglesia local","La misión médica","La diversidad de dones"],c:0,e:"Cristo es el eje; al acercarse a él, los miembros se acercan también unos a otros."},
{q:"¿Qué hace el Espíritu Santo como foco de la unidad?",a:["Ayuda a superar prejuicios y dirige la atención de los creyentes a Cristo","Borra todas las diferencias personales","Favorece a quienes tienen más posición social","Sustituye la verdad bíblica por sentimientos"],c:0,e:"El Espíritu trae la presencia de Cristo al corazón y supera prejuicios de cultura, raza, sexo y posición social."},
{q:"¿Para qué dio Cristo apóstoles, profetas, evangelistas, pastores y maestros?",a:["Para preparar a los santos para el ministerio y edificar el cuerpo hasta la unidad de la fe","Para crear rangos que dividan la iglesia","Para eliminar los dones de los demás","Para reemplazar la misión de todos los creyentes"],c:0,e:"Efesios 4:11-13 presenta esos dones para equipar al pueblo y edificar el cuerpo hacia la unidad y madurez."},
{q:"¿Qué peligro ayudan a evitar los dones espirituales según Efesios 4?",a:["Ser niños fluctuantes arrastrados por todo viento de doctrina","Tener distintas capacidades","Cooperar con otros creyentes","Proclamar la verdad en amor"],c:0,e:"Los dones ayudan a que los creyentes maduren y no sean llevados por doctrinas engañosas."},
{q:"¿Cuál es la base de la unidad según la obra del Espíritu de verdad?",a:["La verdad centrada en Cristo","La uniformidad cultural","La opinión de la mayoría","La administración eficiente"],c:0,e:"El Espíritu guía a la verdad tal como es en Jesús; esa verdad es la base de la unidad."},
{q:"¿Basta el mero estudio de la verdad para producir unidad?",a:["No; también hay que creerla, vivirla y predicarla en Jesús","Sí; la conducta no importa","No; solo se necesita compartir actividades sociales","Sí; el amor es innecesario"],c:0,e:"El texto dice que la unidad surge al creer, vivir y predicar la verdad tal como es en Jesús."},
{q:"¿Qué ordena el nuevo mandamiento de Jesús?",a:["Amarse unos a otros como él nos amó","Amar solo a los miembros de la propia nación","Buscar primero los propios derechos","Servir solo a quienes pueden recompensar"],c:0,e:"Juan 13:34 y 15:12 presentan el llamado a amarse con el amor abnegado de Cristo."},
{q:"¿Dónde se arraiga la unidad de la iglesia de manera especial?",a:["En la cruz y el amor de Cristo revelado allí","En una administración eficiente únicamente","En la eliminación de toda diferencia","En la competencia por cargos"],c:0,e:"El capítulo enseña que la unidad se realiza en la cruz y nace del amor del Calvario."},
{q:"¿Qué nos ayuda a comprender la cruz sobre el valor de todas las personas?",a:["Cristo ama a personas de todas las nacionalidades, razas, colores y clases","Solo algunos grupos tienen valor ante Dios","El valor depende de la posición social","Las diferencias hacen imposible la unidad"],c:0,e:"La cruz revela que Cristo ama a todos y que nadie carece de valor."},
{q:"Complete Gálatas 6:2 como aplicación del Calvario: “Sobrellevad los unos ______ de los otros”.",a:["las cargas","los errores","las diferencias","los cargos"],c:0,e:"El capítulo relaciona el amor de Cristo con llevar las cargas los unos de los otros."},
{q:"¿Dónde se puede practicar primero la unidad que luego se vive en la iglesia?",a:["En el hogar","En los tribunales","Solo en grandes reuniones","En el lugar de trabajo exclusivamente"],c:0,e:"El capítulo llama al hogar un ambiente ideal para ensayar la unidad de la iglesia."},
{q:"¿Qué práctica cotidiana ayuda a cultivar la unidad?",a:["Orar por ella, minimizar diferencias no esenciales y hablar de las verdades compartidas","Evitar toda conversación con quienes discrepan","Insistir en las diferencias menores","Esperar que aparezca sin esfuerzo"],c:0,e:"La unidad requiere esfuerzo consciente, oración y enfoque en las verdades que compartimos."},
{q:"¿Qué blanco común puede unir a la iglesia en acción?",a:["La proclamación del evangelio de Jesucristo","La competencia por recursos","El prestigio de una congregación","La uniformidad de estilos"],c:0,e:"La misión de proclamar el evangelio provee un propósito común para aprender armonía."},
{q:"¿Qué dos aspectos de la misión deben avanzar en cooperación equilibrada?",a:["La predicación de la Palabra y la obra médica misionera","La administración y la competencia","La enseñanza y el aislamiento","La adoración y la rivalidad"],c:0,e:"El capítulo sigue el ejemplo de Cristo al unir la predicación con la atención a las necesidades físicas."},
{q:"¿Qué principio presenta el capítulo para las distintas áreas de la obra de la iglesia?",a:["Cooperación, no rivalidad","Consolidación que descarta funciones pequeñas","Competencia por influencia","Independencia completa de cada área"],c:0,e:"La misión funciona cuando las distintas áreas cooperan, reconociendo que cada miembro importa."},
{q:"¿Qué necesita desarrollar una iglesia para mostrar verdadera unidad mundial?",a:["Una perspectiva global y servicio conjunto entre nacionalidades","Intereses nacionales separados","Aislamiento regional","Dependencia de una sola cultura"],c:0,e:"La unidad requiere apoyar la obra mundial y evitar el aislamiento nacional, cultural o regional."},
{q:"¿Cuál de estas actitudes contribuye a la desunión?",a:["Orgullo, egoísmo, prejuicio y acusaciones mutuas","Paciencia, bondad y amor","Cooperación en la misión","Oración y servicio"],c:0,e:"El capítulo enumera egoísmo, orgullo, prejuicio, críticas y acusaciones como fuentes de desunión."},
{q:"¿Qué fruto del Espíritu funciona como antídoto contra la desunión?",a:["Amor, gozo, paz, paciencia, benignidad, bondad, fe, mansedumbre y templanza","Riqueza, poder, fama y autoridad","Orgullo, crítica y suficiencia propia","Indiferencia, temor y competencia"],c:0,e:"Gálatas 5:22-23 enumera el fruto del Espíritu, que contrarresta actitudes divisivas."},
{q:"¿Qué condena Santiago 2:9 en el trato entre creyentes?",a:["Hacer acepción de personas","Servir a los necesitados","Respetar a todos los miembros","Cooperar entre congregaciones"],c:0,e:"El favoritismo basado en riqueza o posición social es condenado como pecado."},
{q:"¿Cómo debemos tratar a los miembros de distinta riqueza, posición o capacidad?",a:["Con imparcialidad, reconociendo que todos son igualmente valiosos para Dios","Dando mayor importancia a quienes tienen más recursos","Separándolos en grupos distintos","Reservando el servicio para los más capacitados"],c:0,e:"Dios es imparcial; cada persona, incluso la más humilde, tiene igual importancia ante él."},
{q:"¿Qué contribuye a renovar el amor entre creyentes, según la conclusión del capítulo?",a:["Mirar nuevamente el don de Dios en Cristo en el Calvario","Concentrarse en acusaciones mutuas","Evitar depender del Espíritu Santo","Exigir uniformidad de opinión"],c:0,e:"Una nueva mirada a Cristo y su sacrificio puede renovar el amor y vencer fuentes de desunión."}
];
const $=id=>document.getElementById(id);let questions=[],at=0,answers=[],submitted=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){questions=shuffle(bank.map(q=>{const opts=shuffle(q.a.map((text,i)=>({text,correct:i===q.c})));return {...q,a:opts.map(x=>x.text),c:opts.findIndex(x=>x.correct)}})).slice(0,50);answers=Array(questions.length).fill(null);at=0;submitted=false;$("result").classList.add('hidden');$("quiz").classList.remove('hidden');render()}
function render(){const q=questions[at];$("counter").textContent=`Pregunta ${at+1} de ${questions.length}`;$("answered").textContent=`Respondidas: ${answers.filter(x=>x!==null).length}`;$("bar").style.width=`${((at+1)/questions.length)*100}%`;$("prompt").textContent=q.q;const box=$("options");box.innerHTML="";q.a.forEach((txt,i)=>{const b=document.createElement('button');b.className='opt';if(answers[at]===i)b.classList.add('selected');if(submitted&&i===q.c)b.classList.add('correct');if(submitted&&answers[at]===i&&i!==q.c)b.classList.add('wrong');b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>${txt}`;b.disabled=submitted;b.onclick=()=>{answers[at]=i;render()};box.appendChild(b)});const f=$("feedback");if(submitted){f.className='feedback '+(answers[at]===q.c?'good':'bad');f.textContent=(answers[at]===q.c?'¡Correcto! ':'Respuesta correcta: '+q.a[q.c]+'. ')+q.e}else{f.className='feedback hidden';f.textContent=''}$("prev").disabled=at===0;$("next").classList.toggle('hidden',at===questions.length-1);$("finish").classList.toggle('hidden',submitted||at!==questions.length-1);$("finish").disabled=answers.some(x=>x===null);$("next").disabled=answers[at]===null;$("tip").textContent=submitted?'Revisión de respuestas':'Elige una alternativa para continuar'}
$("prev").onclick=()=>{if(at>0){at--;render()}};$("next").onclick=()=>{if(at<questions.length-1){at++;render()}};$("finish").onclick=showResult;
function showResult(){submitted=true;const score=answers.reduce((n,x,i)=>n+(x===questions[i].c?1:0),0),pct=Math.round(score/questions.length*100);$("quiz").classList.add('hidden');const r=$("result");r.classList.remove('hidden');const msg=pct>=90?'Dominio excelente del capítulo.':pct>=75?'Buen trabajo; revisa las preguntas falladas.':pct>=60?'Vas avanzando; repasa los temas que te costaron.':'Conviene repasar el capítulo y volver a intentarlo.';r.innerHTML=`<div class="result"><div class="eyebrow">Resultado</div><div class="score">${score}<span style="font-size:1.5rem;color:#66748b"> / 50</span></div><h2>${pct}% de aciertos</h2><p>${msg}</p><button class="button" id="reviewBtn">Revisar respuestas</button> <button class="button ghost" id="againBtn">Nuevo orden aleatorio</button></div><div class="summary" id="summary"></div>`;$("reviewBtn").onclick=()=>{r.classList.add('hidden');$("quiz").classList.remove('hidden');at=0;render()};$("againBtn").onclick=start;const list=$("summary");questions.forEach((q,i)=>{const el=document.createElement('div');el.className='review';el.innerHTML=`<strong>${i+1}. ${q.q}</strong><span class="${answers[i]===q.c?'right':'your'}">Tu respuesta: ${q.a[answers[i]]}</span>${answers[i]===q.c?'':'<br><span class="right">Correcta: '+q.a[q.c]+'</span>'}<br><span class="small">${q.e}</span>`;list.appendChild(el)})}
start();
</script></body></html>
